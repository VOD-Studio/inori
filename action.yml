name: 'Inori'
description: 'AI code review for pull requests — works with any OpenAI-compatible LLM endpoint. Posts inline comments anchored to real diff lines.'
author: 'VOD-Studio'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  llm_endpoint:
    description: 'OpenAI-compatible API base URL, e.g. https://api.deepseek.com/v1'
    required: true
  llm_model:
    description: 'Model name for both the API call and the review title, e.g. deepseek-chat'
    required: true
  llm_api_key:
    description: 'API key for the LLM endpoint'
    required: true
  github_token:
    description: 'GitHub token with pull-requests:write. Defaults to the workflow token.'
    required: true
    default: ${{ github.token }}
  language:
    description: 'Output language for review comments: zh | en (default zh; fallback order: input > .github/inori.yml)'
    required: false
    default: ''
  ignore_patterns:
    description: 'Comma-separated glob patterns of additional files to skip (built-in defaults include lockfiles, minified files, svg, etc.)'
    required: false
    default: ''
  max_diff_chars:
    description: 'Character limit before the diff is truncated at a file boundary (default 40000)'
    required: false
    default: ''
  max_body_chars:
    description: 'Character limit for the review body (GitHub caps at 65536; default 60000)'
    required: false
    default: ''
  custom_instructions:
    description: 'Extra review rules appended to the prompt (team conventions, banned APIs, etc.)'
    required: false
    default: ''
  on_update:
    description: 'How to handle previous review comments on re-review: replace | resolve | keep (default replace)'
    required: false
    default: ''
  keep_previous_comments:
    description: 'Legacy switch: keep previous inline comments without deletion (equivalent to on_update: keep)'
    required: false
    default: ''
  skip_draft:
    description: 'Skip review when the pull request is in draft status (default true; triggers again on ready_for_review)'
    required: false
    default: ''
  ignore_bots:
    description: 'Skip review for bot-created pull requests (default true)'
    required: false
    default: ''
  ignore_authors:
    description: 'Comma-separated list of PR author usernames to skip'
    required: false
    default: ''
runs:
  using: 'node24'
  main: 'dist/index.js'

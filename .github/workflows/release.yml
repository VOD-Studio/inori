# 发版流水线
#
# GitHub Action 的「部署」就是 git tag 本身——用户通过 VOD-Studio/inori@v0 引用，
# runner 直接拉取仓库里已提交的 dist/index.js 执行。所以这里不构建镜像、不部署，
# 只做两件事：
#   1. push v* tag → 创建 GitHub Release（自动生成 release notes）
#   2. 移动 major version 浮动 tag（v0.1.0 → v0），让 @v0 始终指向最新 v0.x

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release + major tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate-release-notes: true

      # v0.1.0 → 移动 v0 指向它；v1.2.3 → 移动 v1。用户可固定到 @v0 跟随小版本。
      - name: Move major version tag
        run: |
          tag="${GITHUB_REF_NAME}"
          major="${tag%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$tag"
          git push origin "$major" --force

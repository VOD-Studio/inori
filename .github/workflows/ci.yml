# CI 流水线
#
# PR 和 push 到 main 时触发。顺序：lint → typecheck → test → build → dist 一致性校验。
# dist/ 必须与 src/ 同步提交（node24 action 在 runner 上直接跑 dist/index.js，
# 不执行 build），因此「dist 是否最新」是这类项目的核心检查项。
#
# 任一步骤失败则 PR 检查失败，阻止合并。
# release-please 的 release PR（只改 CHANGELOG 与 manifest）也走本流水线。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支多次 push 时取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lint 前置：比 test/build 快，提前暴露格式与静态错误，fail fast
      # biome check = lint + format + import 排序，保证本地与 CI 红绿一致
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # dist 一致性校验：贡献者改了 src/ 但忘了重新 build 并提交 dist/
      # 是 node action 的头号 bug 来源。build 重新生成 dist 后若与提交内容
      # 不一致，说明 dist 过期，直接失败。
      - name: Verify dist is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ 与 src/ 不同步：请本地运行 pnpm build 并提交结果"
            git --no-pager diff --stat dist
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 高危漏洞告警；高危未必被实际调用，初期 advisory 不阻断
      - name: pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

# AI 代码评审（自 dogfood）
#
# PR 打开或更新时，用 inori 评审 inori 自己的 PR——本仓库是 action 的开发仓库，
# 消费 @main 即始终评审最新代码（main 已过本 CI 把关）。
# 评审意见以 review 评论形式出现在 PR 的 File changes 页面，辅助人工 review，
# 不构成合并门禁。
#
# 排除：
#   - release-please 自动生成的 release PR（只改 CHANGELOG 与 manifest 文本）
#   - dist 产物、锁文件与发版文本，避免噪音评论
#
# 首次使用前在仓库 Settings → Secrets 添加 DEEPSEEK_API_KEY
# （platform.deepseek.com 创建）。未配置时本 workflow 跳过，不影响 PR 检查。

name: AI Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

# 同一 PR 多次 push 时取消旧评审，避免并发产生重复评论
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # 提交 review 评论

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: 检查 API key
        if: env.DEEPSEEK_API_KEY == ''
        run: echo "::warning::DEEPSEEK_API_KEY 未配置，AI 评审跳过。在 Settings → Secrets 添加后生效"

      - name: AI 评审
        if: env.DEEPSEEK_API_KEY != ''
        uses: VOD-Studio/inori@main
        with:
          llm_endpoint: https://api.deepseek.com/v1
          llm_model: deepseek-v4-flash
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          ignore_patterns: dist/**,pnpm-lock.yaml,CHANGELOG.md,.release-please-manifest.json

# The repository's own action follows main so merged fixes are exercised immediately.
name: AI Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: 检查 API key
        if: env.DEEPSEEK_API_KEY == ''
        run: echo "::warning::DEEPSEEK_API_KEY 未配置，AI 评审跳过。在 Settings → Secrets 添加后生效"

      - name: AI 评审
        if: env.DEEPSEEK_API_KEY != ''
        uses: VOD-Studio/inori@main
        with:
          provider: deepseek
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          ignore_patterns: dist/**,pnpm-lock.yaml,CHANGELOG.md,.release-please-manifest.json

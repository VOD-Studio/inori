name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: plan
        with:
          script: |
            const { planRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-gate.mjs`)
            return planRelease(github, context.repo)

  verify:
    needs: plan
    if: ${{ toJSON(fromJSON(needs.plan.outputs.plan).shas) != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        sha: ${{ fromJSON(needs.plan.outputs.plan).shas }}
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ matrix.sha }}

  publish:
    needs: [plan, verify]
    if: ${{ github.ref == 'refs/heads/main' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Authorize verified candidates
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_PLAN: ${{ needs.plan.outputs.plan }}
        with:
          script: |
            const { authorizeRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-gate.mjs`)
            await authorizeRelease(github, context.repo, JSON.parse(process.env.RELEASE_PLAN))
      - name: Publish verified releases
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-release-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - name: Reconcile major tags
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_PLAN: ${{ needs.plan.outputs.plan }}
        with:
          script: |
            const { reconcileMajorTags } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-gate.mjs`)
            const result = await reconcileMajorTags(github, context.repo, JSON.parse(process.env.RELEASE_PLAN))
            for (const tag of result.skipped) core.warning(`Skipped unverified major target: ${tag}`)

  recovery-plan:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: plan
        with:
          script: |
            const { planRecovery } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-gate.mjs`)
            return planRecovery(github, context.repo)

  verify-recovery:
    needs: recovery-plan
    if: ${{ toJSON(fromJSON(needs.recovery-plan.outputs.plan).shas) != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        sha: ${{ fromJSON(needs.recovery-plan.outputs.plan).shas }}
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ matrix.sha }}

  recover:
    needs: [recovery-plan, verify-recovery]
    if: ${{ github.ref == 'refs/heads/main' && needs.verify-recovery.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Recover major tags
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_PLAN: ${{ needs.recovery-plan.outputs.plan }}
        with:
          script: |
            const { reconcileMajorTags } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-gate.mjs`)
            const result = await reconcileMajorTags(github, context.repo, JSON.parse(process.env.RELEASE_PLAN))
            for (const tag of result.skipped) core.warning(`Skipped unverified major target: ${tag}`)

  maintain:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Maintain release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
